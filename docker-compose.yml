version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oil_and_gas_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql_scripts:/docker-entrypoint-initdb.d
    networks:
      - oil_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO
  minio:
    image: minio/minio
    container_name: minio_server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - oil_network

  # Jupyter Notebook
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter_notebook
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: "admin123"
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - oil_network
    depends_on:
      - postgres
      - minio

  superset:
    image: apache/superset:4.0.2
    container_name: superset
    ports:
      - "8088:8088"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      SUPERSET_SECRET_KEY: "my_secret_key"
    volumes:
      - superset_home:/app/superset_home
    networks:
      - oil_network
    depends_on:
      - postgres

volumes:
  pg_data:
  minio_data:
  superset_home:

networks:
  oil_network:
    driver: bridge